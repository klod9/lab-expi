<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light">
  <title>A Private Greeting</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { serif: ['"Cormorant Garamond"', 'Georgia', 'serif'], sans: ['Inter', 'system-ui', 'sans-serif'] },
      colors: { navy: '#0f1b2d', gold: '#a8814a', paper: '#f7f6f3' }
    } } };
  </script>
  <style>
    :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
    html { scroll-behavior: smooth; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 4rem); background: #f7f6f3; }
    body { background: #f7f6f3; }
    .reveal { opacity: 0; transform: translateY(12px); transition: opacity .8s ease, transform .8s ease; }
    .reveal.show { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { .reveal { transition: none; opacity: 1; transform: none; } }
  </style>

</head>
<body class="font-sans text-slate-600 bg-paper antialiased">
  <main id="gate" class="min-h-screen flex items-center justify-center px-6">
    <div class="w-full max-w-md text-center">
      <div class="mx-auto mb-8 w-16 h-16 rounded-full border border-gold/60 flex items-center justify-center font-serif text-lg font-semibold tracking-widest text-gold">P.E.A.</div>
      <p class="text-xs font-medium tracking-[0.3em] text-gold uppercase">Private Greeting</p>
      <h1 class="mt-3 font-serif text-4xl font-semibold text-navy">Access Required</h1>
      <p class="mt-4 text-slate-500 font-light">This page was made for one person. Please enter your access code to continue.</p>
      <form id="f" class="mt-8 bg-white border border-slate-200 border-t-2 border-t-gold rounded-lg shadow-sm p-6 text-left" autocomplete="off">
        <label for="pw" class="block text-sm font-medium text-navy">Access code</label>
        <input id="pw" type="password" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" required
          class="mt-2 w-full rounded-md border border-slate-300 px-4 py-3 text-lg tracking-[0.4em] uppercase text-navy focus:outline-none focus:ring-2 focus:ring-gold/50 focus:border-gold">
        <p class="mt-2 text-xs text-slate-400">Hint: three letters, the sender’s initials in the same format as yours.</p>
        <p id="err" role="alert" class="mt-3 text-sm text-red-700 min-h-5"></p>
        <button id="btn" class="mt-2 w-full py-3 text-sm font-medium tracking-wide text-white bg-navy rounded-md hover:bg-slate-800 transition disabled:opacity-60">Unlock</button>
      </form>
    </div>
  </main>
  <div id="app"></div>

    const u=x=>Uint8Array.from(atob(x),ch=>ch.charCodeAt(0));
    async function decrypt(pw){
      const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
      const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.s),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
      return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},k,u(P.d)));
    }
    const $=id=>document.getElementById(id);
    $('pw').focus();
    $('f').onsubmit=async e=>{
      e.preventDefault();
      const btn=$('btn'),err=$('err');
      btn.disabled=true;btn.textContent='Verifying…';err.textContent='';
      try{
        const html=await decrypt($('pw').value.trim().toUpperCase());
        $('gate').remove();
        $('app').innerHTML=html;
        document.title='Happy Birthday, Erich Anne';
        window.scrollTo(0,0);
        const io=new IntersectionObserver(es=>es.forEach(x=>x.isIntersecting&&x.target.classList.add('show')),{threshold:.15});
        document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
      }catch(_){
        err.textContent=window.crypto&&crypto.subtle?'That code isn’t correct. Please try again.':'A secure (https) connection is required.';
        btn.disabled=false;btn.textContent='Unlock';$('pw').select();
      }
    };
  </script>
